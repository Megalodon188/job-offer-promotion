name: Revision Desk engagement report
on:
  push:
    branches: [main]
    paths: ['.github/workflows/engagement-report.yml']
  schedule:
    - cron: '17 19 * * 1,4'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 engagement_report.py
