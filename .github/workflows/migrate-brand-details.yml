name: Align ShowWorth profile details
on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate-brand-details.yml', 'migrate_brand_details.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: showworth-profile-details
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile migrate_brand_details.py
      - run: python3 migrate_brand_details.py
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
