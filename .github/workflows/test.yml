name: Verify promotion code
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest -v test_post.py
      - name: Check disabled posting
        run: python3 post.py
        env:
          PROMOTION_ENABLED: 'false'
      - name: Preview connected product link
        run: CAMPAIGN_START_DATE="$(date -u +%F)" python3 post.py --dry-run
        env:
          PRODUCT_URL: https://payhip.com/b/2EGja
