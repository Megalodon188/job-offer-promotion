name: Align ShowWorth profile name
on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate-profile-name.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: showworth-profile-name
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile migrate_profile_name.py
      - run: python3 migrate_profile_name.py
      - run: python3 migrate_profile_name.py --apply
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
